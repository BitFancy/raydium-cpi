[toolchain]
anchor = "0.30.1"

[features]
seeds = false
skip-lint = false

[registry]
url = "https://anchor.projectserum.com"

[provider]
cluster = "devnet"
wallet = "/root/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[workspace]

[test.validator]
url = "https://api.devnet.solana.com"

[test]
startup_wait = 10000

[build]
bpf-linker = "rust-bpf-linker"
